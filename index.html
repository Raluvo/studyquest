<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyQuest · Grow your study habits</title>
<meta name="description" content="StudyQuest V2 — a study habit tracker where your consistency grows a garden. Prototype by IED Group 10, Universitas Indonesia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fb; --surface:#ffffff; --surface-2:#f1effa; --border:#e5e2f1;
  --text:#1b1838; --muted:#6b6887;
  --brand:#5b3df5; --brand-2:#8b6cff; --brand-soft:#ece8ff; --on-brand:#ffffff;
  --accent:#ff7a3d; --accent-soft:#ffeadd;
  --green:#14a06b; --green-soft:#daf4e8; --blue:#2f7cf6; --blue-soft:#e2edff;
  --red:#e5484d; --red-soft:#fde5e5; --gold:#e9a800; --gold-soft:#fff2cc;
  --leaf:#34b67a; --leaf-2:#86dcab; --stem:#2a8a5a; --pot:#ef7d57; --pot-rim:#f99a76;
  --heat0:#ebe8f5; --heat1:#d6cdff; --heat2:#ac98ff; --heat3:#7c5cff; --heat4:#4f2fe0;
  --shadow:0 1px 2px rgba(27,24,56,.04),0 8px 24px rgba(27,24,56,.06);
  --shadow-lg:0 20px 50px rgba(64,40,180,.18);
  --radius:22px;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0c1b; --surface:#17152a; --surface-2:#211e3a; --border:#2d2949;
    --text:#efedff; --muted:#a29ec2;
    --brand:#8f7bff; --brand-2:#b3a4ff; --brand-soft:#2a2456; --on-brand:#ffffff;
    --accent:#ff9a66; --accent-soft:#3d2620;
    --green:#3ccf91; --green-soft:#153529; --blue:#6ea3ff; --blue-soft:#1b2a4a;
    --red:#ff7b7f; --red-soft:#3d1f24; --gold:#ffc940; --gold-soft:#3a3016;
    --heat0:#221f3b; --heat1:#352c74; --heat2:#5038b0; --heat3:#7a5cff; --heat4:#b3a4ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow-lg:0 20px 50px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0c1b; --surface:#17152a; --surface-2:#211e3a; --border:#2d2949;
  --text:#efedff; --muted:#a29ec2;
  --brand:#8f7bff; --brand-2:#b3a4ff; --brand-soft:#2a2456; --on-brand:#ffffff;
  --accent:#ff9a66; --accent-soft:#3d2620;
  --green:#3ccf91; --green-soft:#153529; --blue:#6ea3ff; --blue-soft:#1b2a4a;
  --red:#ff7b7f; --red-soft:#3d1f24; --gold:#ffc940; --gold-soft:#3a3016;
  --heat0:#221f3b; --heat1:#352c74; --heat2:#5038b0; --heat3:#7a5cff; --heat4:#b3a4ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 20px 50px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.display{font-family:var(--display);font-weight:700;letter-spacing:-.01em}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;
  padding:24px 16px;border-right:1px solid var(--border);background:var(--surface);
}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
.brand-mark{
  width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),#c04ee8);box-shadow:0 6px 16px rgba(91,61,245,.35);
}
.brand-mark svg{width:24px;height:24px}
.brand b{display:block;font-family:var(--display);font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:14px;
  background:transparent;font-weight:600;color:var(--muted);text-align:left;transition:background .15s,color .15s;
}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.active{background:var(--brand-soft);color:var(--brand)}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.mini-garden{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface-2)}
.mini-garden svg{width:52px;height:52px;flex:none}
.mini-garden b{display:block;font-size:14px}
.profile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1px solid var(--border)}
.avatar{
  width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),#e0569b);
}
.profile .who{flex:1;min-width:0}
.profile .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .who span{font-size:12px;color:var(--muted)}

main{padding:28px 36px 56px;width:100%;max-width:1240px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{font-family:var(--display);font-size:30px;letter-spacing:-.01em}
.topbar .sub{font-size:13px;color:var(--muted)}
.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:13px;white-space:nowrap;box-shadow:var(--shadow);
}
.icon-btn{
  width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  display:grid;place-items:center;flex:none;color:var(--text);
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.avatar-btn{padding:0;border:0;background:none;border-radius:50%}
.mobile-only{display:none}
.mobile-brand{display:none}

.bottomnav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
}
.bottomnav .nav-btn{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;align-items:center;text-align:center;width:auto;flex:1}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{font-size:18px;letter-spacing:-.01em}
.card-head .hint{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:20px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.grid-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);
  font-weight:700;font-size:14px;white-space:nowrap;transition:transform .12s,filter .15s,background .15s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:var(--on-brand);box-shadow:0 6px 16px rgba(91,61,245,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 16px rgba(91,61,245,.28)}50%{box-shadow:0 6px 26px rgba(91,61,245,.6)}}
.link{border:0;background:none;padding:0;font-weight:700;color:var(--brand)}

.chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;
  background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.pts{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.green > i{background:linear-gradient(90deg,var(--green),#5fd9a4)}
.bar.warm > i{background:linear-gradient(90deg,var(--accent),#ffb347)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--border);border-radius:16px}

/* ---------- Garden illustration ---------- */
.garden-svg .sway{transform-origin:100px 146px;transform-box:view-box;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.garden-svg .twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

/* ---------- Dashboard ---------- */
.hero{
  position:relative;overflow:hidden;border:0;color:#fff;padding:30px;
  background:radial-gradient(130% 140% at 0% 0%,#6d50ff 0%,#5b3df5 38%,#8f3fe8 70%,#e0569b 100%);
  display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:center;box-shadow:var(--shadow-lg);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;pointer-events:none}
.hero::before{width:260px;height:260px;background:#ffb36b;right:-60px;bottom:-110px}
.hero::after{width:220px;height:220px;background:#59d2ff;left:-80px;top:-120px;opacity:.3}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-bottom:8px}
.hero h1{font-family:var(--display);font-size:36px;letter-spacing:-.01em;margin-bottom:8px}
.hero .line{color:rgba(255,255,255,.88);font-size:15px;max-width:520px}
.name-btn{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dashed rgba(255,255,255,.6)}
.hero-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hchip{
  display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);
}
.hchip .e{font-size:22px;line-height:1}
.hchip b{display:block;font-size:17px;line-height:1.15}
.hchip span{font-size:12px;color:rgba(255,255,255,.82)}
.hchip svg{width:36px;height:36px}
.garden-box{display:flex;flex-direction:column;align-items:center;text-align:center}
.garden-disc{
  width:220px;height:220px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.4),rgba(255,255,255,.08) 68%);
  border:1px solid rgba(255,255,255,.3);
}
.garden-disc svg{width:196px;height:196px}
.garden-label{margin-top:10px;font-weight:800;font-size:15px}
.garden-label small{display:block;font-weight:600;font-size:12px;color:rgba(255,255,255,.8)}

.habit-list{display:flex;flex-direction:column;gap:10px}
.habit-row{
  display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:18px;
  border:1px solid var(--border);background:var(--surface);text-align:left;transition:background .2s,border-color .2s,transform .12s;
}
.habit-row:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.habit-row:active{transform:scale(.99)}
.h-bubble{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px}
.h-main{flex:1;min-width:0;display:flex;flex-direction:column}
.h-name{font-weight:700}
.h-meta{font-size:12px;color:var(--muted)}
.check{
  width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;
  color:transparent;transition:all .2s;background:var(--surface);
}
.check svg{width:16px;height:16px}
.habit-row.done{background:var(--green-soft);border-color:transparent}
.habit-row.done .check,.task-row.done .check{background:var(--green);border-color:var(--green);color:#fff}
.habit-row.done .h-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.just-done .check{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.all-done{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--gold-soft);font-weight:700;margin-top:12px}

.timer-wrap{display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .digits{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .digits b{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring .digits span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.timer-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}

.task-mini{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.task-mini:last-child{border-bottom:0}
.task-mini .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--brand-2)}
.task-mini .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--accent)}
.due.over{color:var(--red)}

.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin:4px 0 6px}
.wb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wb i{display:block;width:100%;max-width:34px;border-radius:10px 10px 6px 6px;background:var(--surface-2);min-height:6px;transition:height .6s}
.wb.on i{background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.wb.today i{outline:2px solid var(--accent);outline-offset:2px}
.wb span{font-size:11px;font-weight:700;color:var(--muted)}
.insights{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.insight{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.insight .ii{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--surface-2)}

.next-treat{display:flex;gap:16px;align-items:center}
.next-treat .t-ico{width:64px;height:64px;font-size:32px}

.heat-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.heat-days{display:grid;grid-template-rows:repeat(7,16px);gap:4px;font-size:10px;color:var(--muted);padding-top:20px}
.heat-grid{display:flex;gap:4px}
.hcol{display:grid;grid-template-rows:16px repeat(7,16px);gap:4px}
.hcol .mlabel{font-size:10px;color:var(--muted);white-space:nowrap;height:14px}
.hc{width:16px;height:16px;border-radius:5px;background:var(--heat0)}
.hc.l1{background:var(--heat1)} .hc.l2{background:var(--heat2)} .hc.l3{background:var(--heat3)} .hc.l4{background:var(--heat4)}
.hc.lf{background:transparent;border:1px dashed var(--border)}
.hc.today{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend .hc{width:12px;height:12px}

/* ---------- Habits ---------- */
.habit-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.habit-card{display:flex;flex-direction:column;gap:16px;transition:transform .15s,box-shadow .15s}
.habit-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.habit-card .top{display:flex;gap:12px;align-items:flex-start}
.habit-card h3{font-size:16px}
.t-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot-btn{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:11px;color:var(--muted);font-weight:600}
.dot-btn span{
  width:100%;aspect-ratio:1;max-width:36px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--border);
  display:grid;place-items:center;color:transparent;transition:all .15s;
}
.dot-btn span svg{width:14px;height:14px}
.dot-btn:hover span{border-color:var(--brand-2)}
.dot-btn.on span{background:var(--green);border-color:var(--green);color:#fff}
.dot-btn.is-today{color:var(--text)}
.dot-btn.is-today span{border-color:var(--accent)}
.habit-card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}

/* ---------- Tasks & goals ---------- */
.seg{display:inline-flex;background:var(--surface-2);border-radius:13px;padding:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.task-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:0}
.task-row.done .t-title{text-decoration:line-through;color:var(--muted)}
.task-row .t-main{flex:1;min-width:0}
.t-title{font-weight:700}
.del{border:0;background:none;color:var(--muted);padding:6px;border-radius:9px;display:grid;place-items:center}
.del:hover{color:var(--red);background:var(--red-soft)}
.del svg{width:16px;height:16px}
.goal{padding:14px 0;border-bottom:1px solid var(--border)}
.goal:last-child{border-bottom:0}
.goal .g-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.goal .g-title{flex:1;font-weight:700;min-width:0}
.goal .g-ctrl{display:flex;align-items:center;gap:10px}
.goal .g-ctrl .bar{flex:1}
.step-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:800;display:grid;place-items:center}
.step-btn:hover{background:var(--surface-2)}
.goal.complete .g-title::after{content:" ✓";color:var(--green)}

/* ---------- Topics ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{border:1px solid var(--border);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.filter.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.mastery .m-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col-head{display:flex;align-items:center;gap:8px;font-weight:800;padding:2px 4px 4px}
.col-head .count{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);padding:2px 9px;border-radius:999px}
.col-dot{width:10px;height:10px;border-radius:50%}
.topic{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.topic .tp-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.topic h4{font-size:15px}
.topic details{font-size:13px;background:var(--surface-2);border-radius:11px;padding:8px 10px}
.topic summary{cursor:pointer;font-weight:700;color:var(--muted)}
.topic details p{margin-top:6px}
.topic .tp-actions{display:flex;gap:6px;justify-content:space-between}

/* ---------- Rewards ---------- */
.jar{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,260px);gap:22px;align-items:center}
.jar .coin{
  width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:38px;
  background:linear-gradient(135deg,var(--gold-soft),var(--accent-soft));
}
.jar .val{font-family:var(--display);font-size:38px;line-height:1.05}
.level-box{padding:14px 16px;border-radius:18px;background:var(--surface-2)}
.level-box .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.treat{display:flex;flex-direction:column;gap:10px;position:relative;transition:transform .15s}
.treat:hover{transform:translateY(-2px)}
.treat.ready{border-color:var(--brand-2);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 55%)}
.t-ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:var(--surface-2)}
.treat.ready .t-ico{background:var(--surface)}
.treat .t-name{font-weight:800}
.treat .t-meta{font-size:12px;color:var(--muted);font-weight:600}
.treat .del{position:absolute;top:12px;right:12px}
.ready-tag{font-size:12px;font-weight:800;color:var(--brand)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.medal{padding:16px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.medal .m-ico{
  width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(135deg,#ffd76a,#ff9f5a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 6px 16px rgba(255,159,90,.35);
}
.medal.locked .m-ico{background:var(--surface-2);box-shadow:none;filter:grayscale(1);opacity:.5}
.medal .m-name{font-weight:800;font-size:14px}
.medal .m-desc{font-size:12px;color:var(--muted)}
.medal .bar{width:100%;height:6px;margin-top:4px}
.ledger-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.ledger-row:last-child{border-bottom:0}
.ledger-row .l-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-size:17px;flex:none}
.ledger-row .l-main{flex:1;min-width:0}
.ledger-row .amt{font-weight:800;white-space:nowrap}
.amt.plus{color:var(--green)} .amt.minus{color:var(--red)}

/* ---------- About ---------- */
.about h2{font-size:20px;margin-bottom:10px}
.about p + p{margin-top:10px}
.quote{padding:14px 18px;background:var(--brand-soft);border-radius:16px;font-weight:600}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.new-item{padding:16px;border-radius:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.new-item .ni{font-size:24px}
.new-item b{font-size:15px}
.new-item p{font-size:13px;color:var(--muted)}
.new-item .why{font-size:12px;font-weight:700;color:var(--brand)}
.process{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.step{padding:14px;border-radius:16px;background:var(--surface-2)}
.step .n{font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.04em}
.step b{display:block;margin:2px 0 4px}
.step p{font-size:13px;color:var(--muted)}
.persona{padding:14px;border-radius:16px;border:1px solid var(--border)}
.persona b{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table-wrap{overflow-x:auto}
ol.howto{margin:0;padding-left:20px}
ol.howto li + li{margin-top:6px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:2px 6px;border-radius:6px}

/* ---------- Login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-art{
  position:relative;overflow:hidden;color:#fff;padding:40px 48px;display:flex;flex-direction:column;
  background:radial-gradient(130% 120% at 0% 0%,#6d50ff 0%,#5b3df5 40%,#8f3fe8 72%,#e0569b 100%);
}
.auth-art::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#ffb36b;filter:blur(70px);opacity:.4;right:-120px;bottom:-140px}
.auth-art::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#59d2ff;filter:blur(70px);opacity:.25;left:-100px;top:-80px}
.auth-art > *{position:relative;z-index:1}
.auth-art .brand span{color:rgba(255,255,255,.8)}
.auth-art .brand-mark{background:rgba(255,255,255,.18);box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.auth-hero{margin:auto 0;display:flex;flex-direction:column;align-items:flex-start;gap:18px;max-width:520px}
.auth-hero .garden-disc{width:250px;height:250px}
.auth-hero .garden-disc svg{width:220px;height:220px}
.auth-hero h2{font-family:var(--display);font-size:40px;line-height:1.1}
.auth-hero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;color:rgba(255,255,255,.9)}
.auth-hero li{display:flex;gap:10px;align-items:center}
.auth-hero li span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.16);flex:none}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative}
.auth-panel .theme-corner{position:absolute;top:20px;right:20px}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}
.auth-card h1{font-family:var(--display);font-size:32px}
.auth-card .seg{align-self:flex-start}
.auth-form{display:flex;flex-direction:column;gap:14px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:70px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.remember input{width:17px;height:17px;accent-color:var(--brand)}
.form-error{padding:10px 12px;border-radius:12px;background:var(--red-soft);color:var(--red);font-weight:700;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.demo-box{border:1px solid var(--border);border-radius:20px;padding:16px;background:var(--surface)}
.demo-box h3{font-size:14px;margin-bottom:4px}
.demo-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.demo-acc{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--border);
  background:var(--bg);text-align:left;transition:border-color .15s,background .15s;
}
.demo-acc:hover{border-color:var(--brand-2);background:var(--brand-soft)}
.demo-acc .avatar{width:34px;height:34px;font-size:14px}
.demo-acc .who{flex:1;min-width:0}
.demo-acc .who b{display:block;font-size:14px}
.demo-acc .who span{font-size:12px;color:var(--muted)}
.demo-acc code{font-size:12px}

/* ---------- Modal, toast, float ---------- */
dialog{
  border:0;border-radius:24px;padding:0;width:min(450px,calc(100vw - 32px));
  background:var(--surface);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.3);
}
dialog::backdrop{background:rgba(14,12,27,.5);backdrop-filter:blur(3px)}
.modal-form{padding:24px;display:flex;flex-direction:column;gap:14px}
.modal-form h3{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--border);background:var(--bg);
}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.field .hint{font-size:12px;color:var(--muted)}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px}
.emoji-chip{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-size:19px;display:grid;place-items:center}
.emoji-chip.on{border-color:var(--brand);background:var(--brand-soft)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{
  background:var(--text);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);animation:toastIn .25s ease;max-width:360px;
}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.float-pts{position:fixed;z-index:80;pointer-events:none;font-weight:800;font-size:16px;color:var(--brand);animation:floatUp 1s ease-out forwards;text-shadow:0 2px 8px rgba(255,255,255,.6)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.8)}15%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-48px) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .process{grid-template-columns:repeat(3,minmax(0,1fr))}
  .jar{grid-template-columns:auto minmax(0,1fr)}
  .jar .level-box{grid-column:1 / -1}
}
@media (max-width:960px){
  .grid-2,.grid-even{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .garden-box{order:-1}
  .board{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-art{padding:28px 24px}
  .auth-hero{margin:24px 0 8px;align-items:center;text-align:center;max-width:none}
  .auth-hero h2{font-size:30px}
  .auth-hero ul{display:none}
  .auth-hero .garden-disc{width:190px;height:190px}
  .auth-hero .garden-disc svg{width:170px;height:170px}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .bottomnav{display:flex}
  main{padding:16px 16px 100px}
  .mobile-brand{display:flex}
  .mobile-only{display:inline-flex}
  .topbar .page-title{display:none}
  .toasts{left:16px;right:16px;bottom:84px;align-items:stretch}
  .toast{max-width:none}
}
@media (max-width:520px){
  .hero{padding:22px;gap:14px}
  .hero h1{font-size:28px}
  .hero .garden-disc{width:150px;height:150px}
  .hero .garden-disc svg{width:134px;height:134px}
  .garden-label{margin-top:6px}
  .hchip{padding:8px 11px}
  .hchip b{font-size:15px}
  .pills .pill.hide-sm{display:none}
  .process{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
  .jar .val{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="auth" class="auth" hidden></div>

<div class="app" id="app" hidden>
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div><b>StudyQuest</b><span>Grow your study habits</span></div>
    </div>
    <nav id="sideNav"></nav>
    <div class="sidebar-foot">
      <div class="mini-garden" id="miniGarden"></div>
      <div class="profile" id="profileBox"></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="mobile-brand brand" style="padding:0"><div class="brand-mark" id="brandMark2"></div><div><b>StudyQuest</b></div></div>
      <div class="page-title"><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub"></div></div>
      <div class="pills" id="pills"></div>
    </header>
    <div id="view" class="stack"></div>
  </main>

  <nav class="bottomnav" id="bottomNav" aria-label="Main navigation"></nav>
</div>

<dialog id="modal"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti"></canvas>

<script>
/* =========================================================
   StudyQuest V2 — IED Group 10 prototype
   Accounts and data are stored only in this browser (localStorage).
   This is a prototype login, not a secure one.
   ========================================================= */
const ACCOUNTS_KEY = 'studyquest-v2-accounts';
const SESSION_KEY = 'studyquest-v2-session';
const USER_KEY = u => `studyquest-v2-user:${u}`;
const THEME_KEY = 'studyquest-theme';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => keyOf(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 864e5);
const fmtLong = k => parseKey(k).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtShort = k => parseKey(k).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtNum = n => n.toLocaleString('en-US');
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const store = {
  get(k, session) { try { return (session ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },
  set(k, v, session) { try { (session ? sessionStorage : localStorage).setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} },
};

const ICONS = {
  dashboard: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  habits: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  tasks: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  topics: '<path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/>',
  rewards: '<path d="M20 12v10H4V12"/><path d="M2 7h20v5H2zM12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
  about: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  sprout: '<path d="M12 22V11"/><path d="M12 11C12 7 9 4 4 4c0 5 3 7 8 7zM12 13c0-4 3-7 8-7 0 5-3 7-8 7z"/>',
};
const svg = (name, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name]}</svg>`;
const BRAND_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V11"/><path d="M12 11C12 7 9 4 4 4c0 5 3 7 8 7zM12 13c0-4 3-7 8-7 0 5-3 7-8 7z"/></svg>';

const VIEWS = [
  { id: 'dashboard', label: 'Dashboard', sub: 'Your study garden and today at a glance' },
  { id: 'habits', label: 'Habits', sub: 'Small daily study habits that grow your streak' },
  { id: 'tasks', label: 'Tasks & Goals', sub: 'Assignments and learning goals' },
  { id: 'topics', label: 'Topics', sub: 'See which materials you understand' },
  { id: 'rewards', label: 'Rewards', sub: 'Treats you choose, milestones you earn' },
  { id: 'about', label: 'About', sub: 'How this prototype came to be' },
];

const STATUS = [
  { label: 'Struggling', color: 'var(--red)' },
  { label: 'Learning', color: 'var(--blue)' },
  { label: 'Mastered', color: 'var(--green)' },
];
const TOPIC_XP = 30;
const STREAK_BONUS = 10;
const EMOJIS = ['📐','📖','🌍','⏱️','🔥','🧮','✍️','💡','🧪','🏗️','📊','🎧','💪','🗂️','🧠','📝'];
const REWARD_EMOJIS = ['🎮','🧋','🎬','😴','🍕','🛍️','🎵','☕','🏖️','🍦'];
const BUBBLES = [['var(--brand-soft)'], ['var(--accent-soft)'], ['var(--green-soft)'], ['var(--blue-soft)'], ['var(--gold-soft)'], ['var(--red-soft)']];
const bubbleFor = str => BUBBLES[[...String(str)].reduce((a, c) => a + c.charCodeAt(0), 0) % BUBBLES.length][0];
const SUGGESTIONS = [
  { name: "Review today's lecture notes", icon: '📖', subject: 'General', xp: 10 },
  { name: 'Solve 5 practice problems', icon: '📐', subject: 'General', xp: 15 },
  { name: 'Read 10 pages of the textbook', icon: '✍️', subject: 'General', xp: 10 },
  { name: 'Explain one formula in my own words', icon: '💡', subject: 'General', xp: 15 },
];

const LEVEL_TITLES = [[1,'Freshman'],[3,'Apprentice'],[5,'Scholar'],[8,'Expert'],[12,'Master'],[16,'Legend']];
const levelTitle = L => LEVEL_TITLES.filter(([l]) => L >= l).pop()[1];

/* ---------- study garden ---------- */
const GARDEN = [
  { min: 0, name: 'Seed', goal: 'planted', tip: 'Finish one habit today to plant it.' },
  { min: 1, name: 'Sprout', goal: 'sprouts', tip: 'A tiny sprout! Keep going.' },
  { min: 3, name: 'Seedling', goal: 'grows into a seedling', tip: 'Leaves are coming in.' },
  { min: 5, name: 'Young plant', goal: 'grows into a young plant', tip: 'Growing strong.' },
  { min: 8, name: 'In bloom', goal: 'blooms', tip: 'Your consistency is blooming.' },
  { min: 14, name: 'Study tree', goal: 'becomes a study tree', tip: 'A full tree — incredible consistency.' },
];
const gardenStage = streak => GARDEN.reduce((a, g, i) => streak >= g.min ? i : a, 0);
function leaf(x, y, rot, s = 1, c = 'var(--leaf)') {
  return `<path d="M0 0C6 -9 20 -10 28 0C20 10 6 9 0 0Z" fill="${c}" transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"/>`;
}
function flower(x, y, c = '#ff8fb8') {
  const petals = [0, 72, 144, 216, 288].map(a => `<circle cx="${x + Math.cos(a * Math.PI / 180) * 6}" cy="${y + Math.sin(a * Math.PI / 180) * 6}" r="5" fill="${c}"/>`).join('');
  return petals + `<circle cx="${x}" cy="${y}" r="4" fill="#ffd34d"/>`;
}
function gardenSvg(stage, label = 'Study garden') {
  const stem = (top, w = 4) => `<path d="M100 146 C100 ${(146 + top) / 2} 98 ${top + 12} 100 ${top}" stroke="var(--stem)" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  let plant = '';

async function hashPw(username, pw) {
  const data = `studyquest:${username}:${pw}`;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 0x811c9dc5;
    for (const ch of data) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193); }
    return 'fnv' + (h >>> 0).toString(16);
  }
}

function emptyState(name = 'Student') {
  return { version: 2, user: { name }, habits: [], completions: {}, ledger: [], tasks: [], goals: [], topics: [], rewards: [], redeemed: [], badges: [] };
}
function blankState(name) {
  const s = emptyState(name);
  s.rewards = DEFAULT_REWARDS.map(r => ({ ...r, id: uid() }));
  return s;
}
function seedState(P) {
  const t = today(), rand = mulberry32(P.seed);
  const s = emptyState(P.name);
  s.habits = P.habits.map(h => ({ ...h }));
  s.habits.forEach(h => s.completions[h.id] = []);
  const done = (h, d) => {
    if (s.completions[h.id].includes(d)) return;
    s.completions[h.id].push(d);
    s.ledger.push({ key: `h:${h.id}:${d}`, date: d, xp: h.xp, type: 'habit', label: h.name });
  };
  for (let i = P.days; i >= 1; i--) {
    const d = addDays(t, -i);
    if (P.rest.includes(i)) continue;
    s.habits.forEach((h, idx) => {
      const p = i <= 6 ? P.recent : P.density;
      if (rand() < p || (i <= P.streakDays && idx === 0)) done(h, d);
    });
  }
  P.today.forEach(idx => done(s.habits[idx], t));
  s.tasks = P.tasks.map(k => ({ id: k.id, title: k.title, subject: k.subject, due: addDays(t, k.due), done: !!k.done, xp: 25 }));
  s.tasks.filter(k => k.done).forEach(k => s.ledger.push({ key: `k:${k.id}`, date: k.due, xp: k.xp, type: 'task', label: k.title }));
  s.goals = P.goals.map(g => ({ ...g }));
  s.topics = P.topics.map(x => ({ ...x }));
  s.topics.filter(x => x.status === 2).forEach((x, i) => s.ledger.push({ key: `tp:${x.id}`, date: addDays(t, -Math.min(P.days, 4 + i * 6)), xp: TOPIC_XP, type: 'topic', label: `Mastered: ${x.name}` }));
  P.focus.forEach((n, i) => s.ledger.push({ key: `f:seed${i}`, date: addDays(t, -n), xp: 15, type: 'focus', label: '25-min focus session' }));
  s.rewards = DEFAULT_REWARDS.map(r => ({ ...r }));
  syncBonuses(s, addDays(t, -P.days));
  settleBalance(s, P.balance, P.days);
  s.badges = unlockedBadges(s);
  return s;
}
// Past treats the persona already enjoyed, so the demo balance looks realistic.
function settleBalance(s, target, days) {
  const byCost = s.rewards.slice().sort((a, b) => b.cost - a.cost);
  let i = 0;
  while (true) {
    const room = points(s) - target;
    const r = byCost.find(x => x.cost <= room);
    if (!r) break;
    s.redeemed.push({ id: uid(), name: r.name, icon: r.icon, cost: r.cost, date: addDays(today(), -(2 + (i * 5) % Math.max(days - 2, 1))) });
    i++;
  }
}

/* ---------- derived stats ---------- */
const xpTotal = (s = S) => s.ledger.reduce((a, e) => a + e.xp, 0);
const spent = (s = S) => s.redeemed.reduce((a, e) => a + e.cost, 0);
const points = (s = S) => xpTotal(s) - spent(s);
const needFor = L => 100 + (L - 1) * 50;
function levelInfo(xp) {
  let L = 1, rem = xp;
  while (rem >= needFor(L)) { rem -= needFor(L); L++; }
  return { level: L, into: rem, need: needFor(L), pct: rem / needFor(L) };
}
function activeDays(s = S) {
  const set = new Set();
  Object.values(s.completions).forEach(a => a.forEach(d => set.add(d)));
  return set;
}
function streakFrom(set) {
  let d = today(); if (!set.has(d)) d = addDays(d, -1);
  let n = 0; while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
const currentStreak = (s = S) => streakFrom(activeDays(s));
const habitStreak = h => streakFrom(new Set(S.completions[h.id] || []));
function bestStreak(s = S) {
  const days = [...activeDays(s)].sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev && diffDays(d, prev) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
const isDone = (h, d) => (S.completions[h.id] || []).includes(d);

// A day earns a streak bonus when it is day 3 or later of an unbroken run.
function syncBonuses(s, from) {
  const set = activeDays(s), t = today();
  for (let d = from; diffDays(d, t) <= 0; d = addDays(d, 1)) {
    const key = `b:${d}`;
    let run = 0, x = d; while (set.has(x)) { run++; x = addDays(x, -1); }
    const has = s.ledger.some(e => e.key === key);
    if (run >= 3 && !has) s.ledger.push({ key, date: d, xp: STREAK_BONUS, type: 'bonus', label: `Streak bonus · day ${run}` });
    if (run < 3 && has) s.ledger = s.ledger.filter(e => e.key !== key);
  }
}

function statsOf(s = S) {
  const xp = xpTotal(s);
  return {
    xp, level: levelInfo(xp).level, best: bestStreak(s),
    checkins: Object.values(s.completions).reduce((a, x) => a + x.length, 0),
    tasks: s.tasks.filter(t => t.done).length,
    mastered: s.topics.filter(t => t.status === 2).length,
    goals: s.goals.filter(g => g.current >= g.target).length,
    focus: s.ledger.filter(e => e.type === 'focus').length,
    redeemed: s.redeemed.length,
  };
}

function mutate(fn) {
  const xp0 = xpTotal(), lv0 = levelInfo(xp0).level, st0 = gardenStage(currentStreak());
  const bonus0 = S.ledger.filter(e => e.type === 'bonus').length;
  fn();
  const xp1 = xpTotal(), lv1 = levelInfo(xp1).level, st1 = gardenStage(currentStreak());
  const bonus1 = S.ledger.filter(e => e.type === 'bonus').length;
  if (xp1 > xp0) floatPoints(`+${xp1 - xp0}`);
  if (bonus1 > bonus0) toast(`🔥 Streak bonus: +${STREAK_BONUS} points for keeping it going`);
  if (st1 > st0) { toast(`🌱 Your garden grew: ${GARDEN[st1].name}!`); confetti(); }
  if (lv1 > lv0) { toast(`🎉 Level ${lv1} — ${levelTitle(lv1)}`); if (st1 <= st0) confetti(); }
  const fresh = unlockedBadges(S).filter(id => !S.badges.includes(id));
  if (fresh.length) {
    S.badges.push(...fresh);
    fresh.forEach(id => { const b = BADGES.find(x => x.id === id); toast(`${b.icon} Milestone reached: ${b.name}`); });
  }
  save();
  render();
}
const removeLedger = key => { S.ledger = S.ledger.filter(e => e.key !== key); };

function toggleHabit(id, date) {
  const h = S.habits.find(x => x.id === id);
  if (!h || diffDays(date, today()) > 0) return;
  justToggled = `${id}:${date}`;
  mutate(() => {
    const list = S.completions[id] || (S.completions[id] = []);
    const key = `h:${id}:${date}`;
    if (list.includes(date)) { S.completions[id] = list.filter(d => d !== date); removeLedger(key); }
    else { list.push(date); S.ledger.push({ key, date, xp: h.xp, type: 'habit', label: h.name }); }

  });
  justToggled = null;
}

function showAuth(mode = 'login', msg = '') {
  authMode = mode;
  $('#app').hidden = true; $('#auth').hidden = false;
  document.title = 'Log in · StudyQuest';
  renderAuth(msg);
  if (!msg) setTimeout(() => $('#auth input')?.focus(), 30);
}
async function doLogin(f) {
  const u = (f.username || '').trim().toLowerCase(), p = f.password || '';
  if (!u || !p) return failAuth('Enter your username and password.', u);
  const acc = findAccount(u);
  let ok = false;
  if (acc && acc.password) ok = p === acc.password;
  else if (acc && acc.hash) ok = (await hashPw(u, p)) === acc.hash;
  if (!ok) return failAuth('That username and password don’t match. Try a sample account below.', u);
  store.del(SESSION_KEY);
  store.set(SESSION_KEY, u, !f.remember);
  enterApp(acc, true);
}
function failAuth(msg, u) {
  renderAuth(msg);
  if (u && $('#lu')) $('#lu').value = u;
  setTimeout(() => ($('#lp') || $('#sn'))?.focus(), 30);
}
async function doSignup(f) {
  const name = (f.name || '').trim(), u = (f.username || '').trim().toLowerCase(), p = f.password || '';
  const again = msg => { renderAuth(msg); $('#sn').value = name; $('#su').value = u; };
  if (!name) return again('Please enter your name.');
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return again('Usernames need 3–20 lowercase letters, numbers or _.');
  if (findAccount(u)) return again('That username is taken. Try another one.');
  if (p.length < 6) return again('Use a password with at least 6 characters.');
  if (p !== f.password2) return again('The two passwords don’t match.');
  const acc = { username: u, name, hash: await hashPw(u, p), created: today() };
  saveCustomAccount(acc);
  store.del(SESSION_KEY);
  store.set(SESSION_KEY, u);
  enterApp(acc, false);
  toast('Account created — add your first habit to plant your garden 🌱');
}
function enterApp(acc, greet) {
  currentUser = acc.username;
  S = loadUser(acc.username) || freshStateFor(acc);
  save();
  view = 'dashboard'; taskFilter = 'open'; topicFilter = 'All';
  $('#auth').hidden = true; $('#app').hidden = false;
  render();
  window.scrollTo({ top: 0 });
  if (greet) toast(`Welcome back, ${S.user.name}! 👋`);
}
function logout() {
  Object.assign(T, { status: 'idle', total: 0, remaining: 25 * 60000 });

}

function dueLabel(due, done) {
  if (!due) return '';

  if (done) return `<span class="due">${fmtShort(due)}</span>`;

  if (n === 0) return `<span class="due soon">Due today</span>`;
  if (n === 1) return `<span class="due soon">Tomorrow</span>`;
  return `<span class="due">In ${n} days</span>`;
}
function ringSvg(pct, size = 36, stroke = 5, color = '#fff', track = 'rgba(255,255,255,.25)') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}

function weekRecap() {
  const t = today(), dow = (parseKey(t).getDay() + 6) % 7;
  const week = [...Array(7)].map((_, i) => addDays(t, i - dow));
  const counts = week.map(d => S.habits.filter(h => isDone(h, d)).length);
  const max = Math.max(S.habits.length, 1);
  const studied = week.filter((d, i) => counts[i] > 0 && diffDays(d, t) <= 0).length;
  const by = {};
  S.habits.forEach(h => { const n = (S.completions[h.id] || []).filter(d => diffDays(t, d) < 14).length; const s = h.subject || 'General'; by[s] = (by[s] || 0) + n; });
  const top = Object.entries(by).filter(([s]) => s !== 'General').sort((a, b) => b[1] - a[1])[0];
  const review = S.topics.find(x => x.status === 0);
  const insights = [
    `<div class="insight"><span class="ii">📅</span><span>You studied on <b>${studied} of ${dow + 1}</b> day${dow ? 's' : ''} so far this week.</span></div>`,
    top && top[1] ? `<div class="insight"><span class="ii">💪</span><span><b>${esc(top[0])}</b> is getting the most practice lately (${top[1]} check-ins in 2 weeks).</span></div>` : '',
    review ? `<div class="insight"><span class="ii">🎯</span><span>Next to tackle: <b>${esc(review.name)}</b> — still marked as struggling.</span></div>` : '',

  return `<div class="card">

    <div class="week-bars">${week.map((d, i) => `<div class="wb ${counts[i] ? 'on' : ''} ${d === t ? 'today' : ''}" title="${fmtLong(d)}: ${counts[i]} habit${counts[i] === 1 ? '' : 's'}"><i style="height:${Math.max(counts[i] / max, .06) * 100}%"></i><span>${DOW[i]}</span></div>`).join('')}</div>

}
function nextTreatCard() {

const WEEKS = 18;
function heatmap() {
  const t = today(), dayXp = {};
  S.ledger.forEach(e => dayXp[e.date] = (dayXp[e.date] || 0) + e.xp);
  const dow = (parseKey(t).getDay() + 6) % 7;
  const start = addDays(t, -(dow + 7 * (WEEKS - 1)));
  let cols = '';
  for (let w = 0; w < WEEKS; w++) {
    const monthStart = [...Array(7)].map((_, d) => parseKey(addDays(start, w * 7 + d))).find(x => x.getDate() === 1);
    let cells = `<span class="mlabel">${monthStart ? monthStart.toLocaleDateString('en-GB', { month: 'short' }) : ''}</span>`;
    for (let d = 0; d < 7; d++) {
      const k = addDays(start, w * 7 + d), fut = diffDays(k, t) > 0, x = dayXp[k] || 0;
      const lv = fut ? 'f' : x === 0 ? 0 : x <= 15 ? 1 : x <= 35 ? 2 : x <= 55 ? 3 : 4;
      cells += `<span class="hc l${lv} ${k === t ? 'today' : ''}" title="${fut ? fmtLong(k) : `${fmtLong(k)}: ${x} points`}"></span>`;
    }
    cols += `<div class="hcol">${cells}</div>`;
  }
  return `<div class="heat-wrap"><div class="heat-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div class="heat-grid">${cols}</div></div>`;
}

          <div class="g-top"><span class="g-title">${esc(g.title)}</span><span class="pts">+${g.xp} pts</span><button class="del" data-action="delGoal" data-id="${g.id}" aria-label="Delete goal">${svg('trash')}</button></div>

/* ---------- focus timer ---------- */
const T = { status: 'idle', minutes: 25, total: 0, endAt: 0, remaining: 25 * 60 * 1000 };
const focusXp = m => Math.max(5, Math.round(m * 0.6));
function timerButtons() {
  if (T.status === 'idle') return [1, 15, 25, 50].map(m => `<button class="btn sm ${m === 25 ? 'primary' : ''}" data-action="timerStart" data-m="${m}">${m} min${m === 1 ? ' demo' : ''}</button>`).join('');
  return `${T.status === 'running' ? '<button class="btn sm" data-action="timerPause">Pause</button>' : '<button class="btn sm primary" data-action="timerResume">Resume</button>'}
    <button class="btn sm ghost" data-action="timerCancel">Cancel</button>`;
}
function updateTimer(buttons) {
  const dg = $('#timerDigits'); if (!dg) return;
  if (T.status === 'running') T.remaining = Math.max(0, T.endAt - Date.now());
  const s = Math.ceil(T.remaining / 1000);
  dg.textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  const C = 2 * Math.PI * 74, frac = T.total ? 1 - T.remaining / T.total : 0;
  $('#timerRing').setAttribute('stroke-dashoffset', C * (1 - frac));
  $('#timerHint').textContent = T.status === 'idle' ? `+${focusXp(25)} points for 25 min` : T.status === 'paused' ? 'paused' : `+${focusXp(T.minutes)} points when done`;
  if (buttons) $('#timerBtns').innerHTML = timerButtons();
}
setInterval(() => {
  if (T.status !== 'running' || !S) return;
  T.remaining = Math.max(0, T.endAt - Date.now());
  if (T.remaining <= 0) {
    const m = T.minutes;
    Object.assign(T, { status: 'idle', total: 0, remaining: 25 * 60 * 1000 });
    lastClick = null;
    mutate(() => S.ledger.push({ key: `f:${Date.now()}`, date: today(), xp: focusXp(m), type: 'focus', label: `${m}-min focus session` }));
    toast(`⏱️ Focus session done — +${focusXp(m)} points`);
    return;
  }
  updateTimer(false);
}, 250);

/* ---------- modal forms ---------- */
function subjectsList() { return [...new Set([...S.habits, ...S.tasks, ...S.topics].map(x => x.subject).filter(Boolean))]; }
function fieldHtml(f) {
  const id = `f_${f.name}`;
  const req = f.required ? 'required' : '';
  let input;
  if (f.type === 'emoji') {
    const val = f.value || f.options[0];
    input = `<input type="hidden" name="${f.name}" value="${esc(val)}"><div class="emoji-row">${f.options.map(e => `<button type="button" class="emoji-chip ${e === val ? 'on' : ''}" data-emoji="${e}">${e}</button>`).join('')}</div>`;
  } else if (f.type === 'select') {
    input = `<select id="${id}" name="${f.name}">${f.options.map(o => `<option value="${o.value}" ${String(o.value) === String(f.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}" ${req}>${esc(f.value || '')}</textarea>`;
  } else {
    input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.list ? `list="${id}_list"` : ''} ${req} maxlength="${f.type === 'number' ? '' : 80}">
      ${f.list ? `<datalist id="${id}_list">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}
function openForm({ title, fields, submit = 'Save', onSubmit }) {
  const dlg = $('#modal');
  dlg.innerHTML = `<form class="modal-form"><h3>${esc(title)}</h3>${fields.map(fieldHtml).join('')}
    <div class="modal-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary">${esc(submit)}</button></div></form>`;
  const form = dlg.querySelector('form');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    Object.keys(data).forEach(k => data[k] = typeof data[k] === 'string' ? data[k].trim() : data[k]);
    dlg.close();
    onSubmit(data);
  });
  form.addEventListener('click', e => {
    const chip = e.target.closest('.emoji-chip');
    if (chip) {
      chip.parentElement.querySelectorAll('.emoji-chip').forEach(c => c.classList.toggle('on', c === chip));
      chip.parentElement.previousElementSibling.value = chip.dataset.emoji;
    }
    if (e.target.closest('[data-close]')) dlg.close();
  });
  dlg.showModal();
  form.querySelector('input:not([type=hidden]),select,textarea')?.focus();
}
function askConfirm({ title, body, ok = 'Confirm', danger = false }, onOk) {
  const dlg = $('#modal');
  dlg.innerHTML = `<form class="modal-form"><h3>${esc(title)}</h3>${body ? `<p class="muted">${esc(body)}</p>` : ''}
    <div class="modal-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${esc(ok)}</button></div></form>`;
  dlg.querySelector('form').addEventListener('submit', e => { e.preventDefault(); dlg.close(); onOk(); });
  dlg.querySelector('[data-close]').onclick = () => dlg.close();
  dlg.showModal();
}

      { name: 'subject', label: 'Subject', placeholder: 'e.g. Mechanics', list: subjectsList() },
      { name: 'xp', label: 'Points per check-in', type: 'select', options: xpOptions, value: 10, hint: 'Harder habits deserve more points.' },
    ], onSubmit: f => { const id = uid(); S.habits.push({ id, name: f.name, icon: f.icon, subject: f.subject || 'General', xp: +f.xp }); S.completions[id] = []; save(); render(); toast('Habit added'); } }),
  editHabit: d => {
    const h = S.habits.find(x => x.id === d.id);
    openForm({ title: 'Edit habit', fields: [
      { name: 'name', label: 'Habit', value: h.name, required: true },
      { name: 'icon', label: 'Icon', type: 'emoji', options: EMOJIS.includes(h.icon) ? EMOJIS : [h.icon, ...EMOJIS], value: h.icon },
      { name: 'subject', label: 'Subject', value: h.subject, list: subjectsList() },
      { name: 'xp', label: 'Points per check-in', type: 'select', options: xpOptions, value: h.xp },
    ], onSubmit: f => { Object.assign(h, { name: f.name, icon: f.icon, subject: f.subject || 'General', xp: +f.xp }); save(); render(); } });
  },
  delHabit: d => {
    const h = S.habits.find(x => x.id === d.id);
    askConfirm({ title: `Delete “${h.name}”?`, body: 'Points you already earned from this habit are kept.', ok: 'Delete habit', danger: true },
      () => { S.habits = S.habits.filter(x => x.id !== d.id); save(); render(); toast('Habit deleted'); });
  },
  addTask: () => openForm({ title: 'New task', submit: 'Add task', fields: [
      { name: 'title', label: 'Task', placeholder: 'e.g. Mechanics problem set 5', required: true },
      { name: 'subject', label: 'Subject', list: subjectsList() },
      { name: 'due', label: 'Due date', type: 'date', value: addDays(today(), 3) },
      { name: 'xp', label: 'Points', type: 'select', options: [15, 25, 40, 60].map(v => ({ value: v, label: `${v} points` })), value: 25 },
    ], onSubmit: f => { S.tasks.push({ id: uid(), title: f.title, subject: f.subject, due: f.due, done: false, xp: +f.xp }); taskFilter = 'open'; save(); render(); toast('Task added'); } }),
  toggleTask: d => mutate(() => {
    const k = S.tasks.find(x => x.id === d.id);
    k.done = !k.done;
    if (k.done) S.ledger.push({ key: `k:${k.id}`, date: today(), xp: k.xp, type: 'task', label: k.title });
    else removeLedger(`k:${k.id}`);
  }),
  delTask: d => { S.tasks = S.tasks.filter(x => x.id !== d.id); save(); render(); },
  taskFilter: d => { taskFilter = d.f; render(); },
  addGoal: () => openForm({ title: 'New learning goal', submit: 'Add goal', fields: [
      { name: 'title', label: 'Goal', placeholder: 'e.g. Finish 15 truss problems', required: true },
      { name: 'target', label: 'Target (number of steps)', type: 'number', value: 10, min: 1, required: true },
      { name: 'xp', label: 'Bonus when completed', type: 'select', options: [30, 50, 80, 120].map(v => ({ value: v, label: `${v} points` })), value: 50 },
    ], onSubmit: f => { S.goals.push({ id: uid(), title: f.title, target: Math.max(1, Math.round(+f.target) || 1), current: 0, xp: +f.xp }); save(); render(); toast('Goal added'); } }),
  goalStep: d => mutate(() => {
    const g = S.goals.find(x => x.id === d.id);
    const was = g.current >= g.target;
    g.current = Math.max(0, Math.min(g.target, g.current + Number(d.d)));
    const now = g.current >= g.target;
    if (!was && now) S.ledger.push({ key: `g:${g.id}`, date: today(), xp: g.xp, type: 'goal', label: `Goal complete: ${g.title}` });
    if (was && !now) removeLedger(`g:${g.id}`);
  }),
  delGoal: d => { S.goals = S.goals.filter(x => x.id !== d.id); save(); render(); },
  addTopic: () => openForm({ title: 'New topic', submit: 'Add topic', fields: [
      { name: 'name', label: 'Topic', placeholder: 'e.g. Bending moment diagrams', required: true },
      { name: 'subject', label: 'Subject', value: topicFilter !== 'All' ? topicFilter : '', list: subjectsList(), required: true },
      { name: 'status', label: 'How well do you understand it?', type: 'select', value: 0, options: STATUS.slice(0, 2).map((s, i) => ({ value: i, label: s.label })) },
      { name: 'note', label: 'Simple explanation / real-life example (optional)', type: 'textarea', placeholder: 'Where do you see this in real life?' },
    ], onSubmit: f => { S.topics.push({ id: uid(), name: f.name, subject: f.subject, status: +f.status, note: f.note }); save(); render(); toast('Topic added'); } }),
  noteTopic: d => {
    const t = S.topics.find(x => x.id === d.id);
    openForm({ title: `Real-life example: ${t.name}`, fields: [{ name: 'note', label: 'Explain it simply or link it to something real', type: 'textarea', value: t.note, required: true }],
      onSubmit: f => { t.note = f.note; save(); render(); } });
  },
  moveTopic: d => mutate(() => {
    const t = S.topics.find(x => x.id === d.id);
    const before = t.status;
    t.status = Math.max(0, Math.min(2, t.status + Number(d.d)));
    if (t.status === 2 && before !== 2) S.ledger.push({ key: `tp:${t.id}`, date: today(), xp: TOPIC_XP, type: 'topic', label: `Mastered: ${t.name}` });
    if (before === 2 && t.status !== 2) removeLedger(`tp:${t.id}`);
  }),
  delTopic: d => { S.topics = S.topics.filter(x => x.id !== d.id); save(); render(); },
  topicFilter: d => { topicFilter = d.s; render(); },
  addReward: () => openForm({ title: 'New treat', submit: 'Add treat', fields: [
      { name: 'name', label: 'Treat', placeholder: 'e.g. Order my favourite food', required: true },
      { name: 'icon', label: 'Icon', type: 'emoji', options: REWARD_EMOJIS },
      { name: 'cost', label: 'Cost in points', type: 'number', value: 150, min: 10, required: true, hint: 'A 25-minute focus session is 15 points; a typical habit is 10–15.' },
    ], onSubmit: f => { S.rewards.push({ id: uid(), name: f.name, icon: f.icon, cost: Math.max(10, Math.round(+f.cost) || 10) }); save(); render(); toast('Treat added'); } }),
  redeem: d => {
    const r = S.rewards.find(x => x.id === d.id);
    if (points() < r.cost) return;
    askConfirm({ title: `Claim ${r.icon} ${r.name}?`, body: `This uses ${fmtNum(r.cost)} of your ${fmtNum(points())} points. You'll have ${fmtNum(points() - r.cost)} left.`, ok: 'Claim treat' }, () => {
      mutate(() => S.redeemed.push({ id: uid(), name: r.name, icon: r.icon, cost: r.cost, date: today() }));
      toast(`${r.icon} Enjoy it — you earned this!`); confetti();
    });
  },
  delReward: d => { S.rewards = S.rewards.filter(x => x.id !== d.id); save(); render(); },
  timerStart: d => { const m = +d.m; Object.assign(T, { status: 'running', minutes: m, total: m * 60000, remaining: m * 60000, endAt: Date.now() + m * 60000 }); updateTimer(true); },
  timerPause: () => { T.remaining = Math.max(0, T.endAt - Date.now()); T.status = 'paused'; updateTimer(true); },
  timerResume: () => { T.endAt = Date.now() + T.remaining; T.status = 'running'; updateTimer(true); },
  timerCancel: () => { Object.assign(T, { status: 'idle', total: 0, remaining: 25 * 60000 }); updateTimer(true); },
  resetDemo: () => askConfirm({ title: 'Reset your data?', body: 'Your habits, tasks and progress go back to how this account started.', ok: 'Reset' },
    () => { S = freshStateFor(findAccount(currentUser)); save(); view = 'dashboard'; render(); toast('Data reset'); }),
  clearAll: () => askConfirm({ title: 'Start a blank tracker?', body: 'All current habits, tasks, topics and progress for this account will be removed.', ok: 'Start blank', danger: true }, () => {
    S = blankState(S.user.name);
    save(); view = 'dashboard'; render(); toast('Blank tracker ready — add your first habit!');
  }),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  if (e.clientX || e.clientY) lastClick = { x: e.clientX, y: e.clientY };
  else { const r = el.getBoundingClientRect(); lastClick = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset, el, e);
});

/* ---------- toast, floating points & confetti ---------- */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, 2800);
}
function floatPoints(text) {
  const p = lastClick || { x: innerWidth / 2, y: innerHeight / 2 };
  const el = document.createElement('div');
  el.className = 'float-pts'; el.textContent = `${text} points`;
  el.style.left = `${p.x}px`; el.style.top = `${p.y - 10}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#5b3df5', '#8b6cff', '#ff7a3d', '#34b67a', '#ffd34d', '#e0569b'];
  const parts = [...Array(140)].map(() => ({
    x: c.width / 2 + (Math.random() - .5) * 200, y: c.height * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
    s: Math.random() * 6 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 2400) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })(t0);
}

/* ---------- init ---------- */
{ const th = store.get(THEME_KEY); if (th) document.documentElement.dataset.theme = th; }
$('#brandMark').innerHTML = BRAND_SVG; $('#brandMark2').innerHTML = BRAND_SVG;
let wasNarrow = innerWidth <= 860;
addEventListener('resize', () => { const n = innerWidth <= 860; if (n !== wasNarrow) { wasNarrow = n; if (S) renderNav(); } });
{
  const u = getSession(), acc = u && findAccount(u);
  if (acc) enterApp(acc, false); else showAuth('login');
}
